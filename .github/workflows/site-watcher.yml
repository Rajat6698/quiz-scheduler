name: Watch Job Sites

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# never run two checks at the same time
concurrency:
  group: site-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-watcher.txt

      - name: Reuse downloaded fonts
        uses: actions/cache@v4
        with:
          path: fonts
          key: statsguru-fonts-v2

      - name: Install dependencies
        run: pip install -r requirements-watcher.txt

      - name: Check sites and handle approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python watch_sites.py
